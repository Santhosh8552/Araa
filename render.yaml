services:
  - type: web
    name: araabot-trade-pro
    env: python
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 8 --timeout 120 --keep-alive 5 --bind 0.0.0.0:${PORT:-5050} run:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HOST
        value: 0.0.0.0
      - key: SEED_DEMO_USERS
        value: "1"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRETS_KEY
        generateValue: true
